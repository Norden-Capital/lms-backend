services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: lms-postgres
    environment:
      POSTGRES_DB: lmsdb
      POSTGRES_USER: lmsuser
      POSTGRES_PASSWORD: lmspassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmsuser -d lmsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/anter-mena/lms-backend:latest
    restart: unless-stopped
    container_name: lms-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/lmsdb
      - SPRING_DATASOURCE_USERNAME=lmsuser
      - SPRING_DATASOURCE_PASSWORD=lmspassword123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
