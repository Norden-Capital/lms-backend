services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: lms-postgres
    environment:
      POSTGRES_DB: lmsdb
      POSTGRES_USER: lmsuser
      # The fallback exists so local development works with no setup. On the VPS
      # the deploy writes /opt/myapp/.env, and that value wins. Never let the
      # fallback be what production actually runs on.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmspassword123}
    # No "ports" on purpose. The backend container reaches this database over the
    # internal compose network as db:5432, so publishing 5432 to the host would
    # only expose Postgres to the public internet without the backend gaining
    # anything. Local development adds the port back in docker-compose.override.yml,
    # bound to 127.0.0.1, because Maven runs on the host rather than in a container.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmsuser -d lmsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Lets the backend see the containers without ever touching the Docker socket.
  #
  # That socket is root on the host with no password: anything that can talk to it
  # can start a privileged container and take the machine. Mounting it into a
  # public-facing web application turns one bug in that application into a total
  # compromise, so the backend does not get it. This does, and republishes only
  # what the health screen reads.
  #
  # CONTAINERS=1 is the only permission granted. Everything else — images,
  # volumes, networks, exec — is refused, and POST/PUT/DELETE are refused across
  # the board because POST defaults to 0. Verified against this server: GET
  # /containers/json answers, POST /containers/lms-backend/restart returns 403.
  #
  # No "ports" on purpose. Publishing 2375 would put a Docker API on the public
  # internet, which is strictly worse than the socket it is protecting. Only
  # containers on this compose network can reach it.
  docker-socket-proxy:
    # Pinned. "latest" on an image that guards the Docker socket means an
    # unreviewed change to the thing holding the keys, arriving on a deploy that
    # was about something else entirely.
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    container_name: lms-docker-proxy
    environment:
      - CONTAINERS=1
    volumes:
      # Read-only. The proxy is the boundary, not this flag — a socket is a
      # two-way conversation and :ro does not make the API read-only — but there
      # is no reason to hand out more than is needed.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backend:
    image: ghcr.io/anter-mena/lms-backend:latest
    restart: unless-stopped
    container_name: lms-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/lmsdb
      - SPRING_DATASOURCE_USERNAME=lmsuser
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-lmspassword123}

      # SPRING_JPA_HIBERNATE_DDL_AUTO is deliberately absent. Environment
      # variables override application.properties, so setting it here would put
      # Hibernate back in charge of the schema and undo `ddl-auto=validate`,
      # which exists so Flyway owns migrations alone.

      # Unset means the application invents a random key at every boot: all
      # tokens die on restart, and any stored MFA secret becomes permanently
      # undecryptable. The deploy job refuses to continue if these are empty.
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

      # The first administrator, created once on a database with no users in it
      # and ignored forever after. There is deliberately no fallback: unset means
      # no account is created, which is recoverable — a default password in a
      # public repository is not.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BOOTSTRAP_ADMIN_FIRST_NAME=${BOOTSTRAP_ADMIN_FIRST_NAME:-System}
      - BOOTSTRAP_ADMIN_LAST_NAME=${BOOTSTRAP_ADMIN_LAST_NAME:-Administrator}

      # By service name over the internal network. Nothing is published, so this
      # address does not exist anywhere outside this compose project.
      - DOCKER_API_URL=http://docker-socket-proxy:2375
    volumes:
      # Read-only, and a single file. Unlike /proc — which Docker does not put in
      # a namespace, so the container already sees the host's real CPU, memory
      # and load — /etc/os-release IS namespaced, so without this the System
      # Health page reports the container's Alpine instead of the machine's
      # Ubuntu. Nothing else is exposed by it.
      - /etc/os-release:/host/etc/os-release:ro

      # The machine's network counters. /proc/net is namespaced too, and unlike
      # os-release you cannot bind-mount your way out of it: procfs answers from
      # the namespace of whoever is reading, so mounting /proc/net/dev still
      # returns the container's own few megabytes. Naming a process that lives in
      # the host's namespace does work, and PID 1 is always there.
      #
      # This is one file of interface byte counters. It is NOT /proc or /proc/1 —
      # those would expose every process on the machine, including command lines
      # and environments, which is where secrets live.
      - /proc/1/net/dev:/host/proc/1/net/dev:ro

    # Deliberately NOT depending on docker-socket-proxy. The backend is the
    # product and the proxy is a panel on a monitoring page; coupling them means
    # a failed pull of a third-party image takes the application down. Nothing
    # needs it at startup either — it is read per request, and an unreachable one
    # is already handled as "no data source" rather than an error.
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
