# Lives on the VPS at /opt/myapp/docker-compose.yml
# The deploy job SSHes in and runs:
#   docker compose pull backend && docker compose up -d --no-deps backend

services:
  backend:
    image: ghcr.io/anter-mena/lms-backend:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Database – uncomment and set via .env on the VPS
      # - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mydb
      # - SPRING_DATASOURCE_USERNAME=myuser
      # - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    # env_file: .env   # keep real secrets out of this repo, use a .env on the VPS

