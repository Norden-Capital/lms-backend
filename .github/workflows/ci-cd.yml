name: CI/CD – Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Lowercase on purpose: GHCR rejects uppercase, and the org is "Norden-Capital".
  # Must match the image in docker-compose.yml.
  IMAGE_NAME: norden-capital/lms-backend

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build & Test
  # ──────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    # A throwaway Postgres for the test run. Flyway builds the schema into it
    # from the migrations, which also proves the migrations themselves apply.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lmsdb_test
          POSTGRES_USER: lmsuser
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmsuser -d lmsdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

      # Tests were skipped originally because there was no database in CI.
      # The service container above supplies one, so they can run for real.
      # Keep this step: a compile-only pipeline cannot catch a broken login.
      - name: Run tests
        run: ./mvnw test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lmsdb_test
          SPRING_DATASOURCE_USERNAME: lmsuser
          SPRING_DATASOURCE_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
          ENCRYPTION_KEY: ci-only-encryption-key

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build & Push Docker image  (main branch pushes only)
  # ──────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker image
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Deploy to VPS over SSH
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    # The job's own GITHUB_TOKEN pulls the image, so no personal token is needed.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/myapp"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_FIRST_NAME: ${{ secrets.BOOTSTRAP_ADMIN_FIRST_NAME }}
          BOOTSTRAP_ADMIN_LAST_NAME: ${{ secrets.BOOTSTRAP_ADMIN_LAST_NAME }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: JWT_SECRET,ENCRYPTION_KEY,POSTGRES_PASSWORD,BOOTSTRAP_ADMIN_EMAIL,BOOTSTRAP_ADMIN_PASSWORD,BOOTSTRAP_ADMIN_FIRST_NAME,BOOTSTRAP_ADMIN_LAST_NAME,SPRING_MAIL_HOST,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD,GHCR_TOKEN
          script: |
            set -e

            cd /opt/myapp

            # Fail before touching anything if a secret is missing. Booting
            # without these produces an app that looks healthy and quietly
            # invalidates every token and MFA secret on the next restart.
            [ -n "$JWT_SECRET" ]        || { echo "::error::JWT_SECRET is empty — add it under Settings > Secrets > Actions"; exit 1; }
            [ -n "$ENCRYPTION_KEY" ]    || { echo "::error::ENCRYPTION_KEY is empty — add it under Settings > Secrets > Actions"; exit 1; }
            [ -n "$POSTGRES_PASSWORD" ] || { echo "::error::POSTGRES_PASSWORD is empty — add it under Settings > Secrets > Actions"; exit 1; }

            # docker compose reads this automatically from the working directory.
            umask 077
            cat > .env <<EOF
            JWT_SECRET=${JWT_SECRET}
            ENCRYPTION_KEY=${ENCRYPTION_KEY}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
            BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
            BOOTSTRAP_ADMIN_FIRST_NAME=${BOOTSTRAP_ADMIN_FIRST_NAME}
            BOOTSTRAP_ADMIN_LAST_NAME=${BOOTSTRAP_ADMIN_LAST_NAME}
            SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
            SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
            SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
            EOF

            # The job token is only valid while this job runs, so log out at the
            # end rather than leave a dead credential on the server.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the new image and start both backend and postgres
            docker compose pull
            docker logout ghcr.io
            docker compose up -d

            # Remove dangling images to keep disk clean
            docker image prune -f

            # The deploy is not finished until the app answers. Without this the
            # job prints a tick even when the container never started, which is
            # exactly how the backend sat down unnoticed.
            echo "Waiting for the backend to report healthy..."
            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
                echo "✅ Deployment complete and healthy – $(date)"
                exit 0
              fi
              sleep 5
            done

            echo "::error::Backend did not become healthy within 150s"
            docker compose ps
            docker compose logs --tail 120 backend
            exit 1
