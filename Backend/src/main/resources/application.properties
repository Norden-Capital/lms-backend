spring.application.name=Backend

# ─── Datasource ──────────────────────────────────────────────────────────────
# Local defaults; the SPRING_DATASOURCE_* env vars in docker-compose override them.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lmsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lmsuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lmspassword123}

# ─── Schema ──────────────────────────────────────────────────────────────────
# Flyway owns the schema. Hibernate only checks its entities line up with what
# the migrations built, and fails at startup if they have drifted apart.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ─── Security ────────────────────────────────────────────────────────────────
# Both are intentionally blank: no secret belongs in a file that is committed.
# Left unset, the app generates a random key at startup and logs a loud warning.
#   app.jwt.secret        - min 32 chars. Unset => tokens die on restart.
#   app.encryption.key    - encrypts MFA secrets. Unset => 2FA breaks on restart.
app.jwt.secret=${JWT_SECRET:}
app.encryption.key=${ENCRYPTION_KEY:}

# How long a login lasts, and how long the half-finished 2FA step stays open.
app.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT24H}
app.jwt.mfa-token-ttl=${JWT_MFA_TTL:PT5M}

# Name shown in Google Authenticator next to the account.
app.mfa.issuer=${MFA_ISSUER:LMS}

# Browser origins allowed to call this API. Comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Docs ────────────────────────────────────────────────────────────────────
# The Swagger UI page itself is served by DocsController at /api/docs.
springdoc.api-docs.path=/v3/api-docs

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# Percentiles for request timings. Micrometer records a mean unless asked for
# these, and a mean hides the one request in twenty that takes four seconds —
# which is the one people actually feel.
management.metrics.distribution.percentiles.http.server.requests=0.95,0.99

# ─────────────────────────────────────────────────────────────────────────────
# The first administrator.
#
# Read once, on a database with no users in it, and ignored on every boot after
# that. No defaults on purpose: unset means no account is created and a warning
# is logged, which is recoverable. A default password in a repository is not —
# that is what the old seeder did, and admin@example.com / admin123 was live on
# the server for weeks because of it.
# ─────────────────────────────────────────────────────────────────────────────
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}
