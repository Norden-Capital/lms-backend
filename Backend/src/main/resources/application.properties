spring.application.name=Backend

# ─── Datasource ──────────────────────────────────────────────────────────────
# Local defaults; the SPRING_DATASOURCE_* env vars in docker-compose override them.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lmsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lmsuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lmspassword123}

# ─── Schema ──────────────────────────────────────────────────────────────────
# Flyway owns the schema. Hibernate only checks its entities line up with what
# the migrations built, and fails at startup if they have drifted apart.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ─── Security ────────────────────────────────────────────────────────────────
# Both are intentionally blank: no secret belongs in a file that is committed.
# Left unset, the app generates a random key at startup and logs a loud warning.
#   app.jwt.secret        - min 32 chars. Unset => tokens die on restart.
#   app.encryption.key    - encrypts MFA secrets. Unset => 2FA breaks on restart.
app.jwt.secret=${JWT_SECRET:}
app.encryption.key=${ENCRYPTION_KEY:}

# How long a login lasts, and how long the half-finished 2FA step stays open.
app.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT24H}
app.jwt.mfa-token-ttl=${JWT_MFA_TTL:PT5M}

# Name shown in Google Authenticator next to the account.
app.mfa.issuer=${MFA_ISSUER:LMS}

# Browser origins allowed to call this API. Comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Docs ────────────────────────────────────────────────────────────────────
# The Swagger UI page itself is served by DocsController at /api/docs.
springdoc.api-docs.path=/v3/api-docs

# Off unless API_DOCS_ENABLED=true — decided 2026-10-26. Public, the list of
# every address (admin, backups, 2FA reset, sending mail) was a free map for
# anyone probing the server. Turn it on locally when you want the page.
app.docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${app.docs.enabled}
springdoc.swagger-ui.enabled=${app.docs.enabled}

# ─── Behind Caddy ─────────────────────────────────────────────────────────────
# Caddy takes the https call and passes it on over plain http, telling us so in
# X-Forwarded-Proto. Trusting that (only from the server itself and Docker's
# private addresses) — added 2026-10-26 — makes the app know it is on https:
# its own links and redirects start with https://, and Spring Security sends
# Strict-Transport-Security, which it only does on https.
server.forward-headers-strategy=native

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# Percentiles for request timings. Micrometer records a mean unless asked for
# these, and a mean hides the one request in twenty that takes four seconds —
# which is the one people actually feel.
management.metrics.distribution.percentiles.http.server.requests=0.95,0.99

# ─── Containers ──────────────────────────────────────────────────────────────
# Where to ask about containers. NOT the Docker socket: that is root on the host,
# and this is a web application. Compose runs a proxy that holds the socket and
# republishes a GET-only slice of the API, and this points at that.
#
# The default suits local development, where `docker compose up -d docker-socket-
# proxy` publishes it on 127.0.0.1 and everything works with no configuration. In
# the container the compose file names the proxy directly. Nothing listening
# means the Containers tab says it has no source — never a wrong number.
docker.api.url=${DOCKER_API_URL:http://localhost:2375}

# ─────────────────────────────────────────────────────────────────────────────
# The first administrator.
#
# Read once, on a database with no users in it, and ignored on every boot after
# that. No defaults on purpose: unset means no account is created and a warning
# is logged, which is recoverable. A default password in a repository is not —
# that is what the old seeder did, and admin@example.com / admin123 was live on
# the server for weeks because of it.
# ─────────────────────────────────────────────────────────────────────────────
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}

# ─────────────────────────────────────────────────────────────────────────────
# Email — invitations and password-reset links.
#
# The server itself is configured by Spring's own variables, read straight from
# the environment: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD. They are deliberately not declared here: an empty
# host is still "a host" to Spring. With no host set, nothing is sent and the
# link is written to the log instead (see MailService), so local development
# needs no mail server.
# ─────────────────────────────────────────────────────────────────────────────
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:Norden Capital <noreply@nordencapital.ca>}

# Where the links in those emails point. No trailing slash needed — it is trimmed.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ─────────────────────────────────────────────────────────────────────────────
# The website's shared secret — decided 2026-10-19.
#
# The website calls this API from its own server, so without help every visitor
# looks like the same few Vercel addresses. It forwards the visitor's address
# in X-Client-IP and proves the header is its own with this secret (the same
# value as PROXY_SECRET in Vercel). Rate limits and the action log then see
# real visitors. Unset, the forwarded address is ignored and rate limits are
# relaxed tenfold — see RateLimitFilter.
# ─────────────────────────────────────────────────────────────────────────────
app.proxy-secret=${PROXY_SECRET:}

# ─────────────────────────────────────────────────────────────────────────────
# Backups — decided 2026-10-20. See BackupService.
#
# Every night at 03:00 UTC the database is copied into this folder (a Docker
# volume on the server), checked, and sent to a Cloudflare R2 bucket. Nothing
# is deleted automatically.
#
# R2 unset means the copies stay on the server only, and the Backups page says
# "Server only". The endpoint is https://<account id>.r2.cloudflarestorage.com.
# ─────────────────────────────────────────────────────────────────────────────
app.backup.directory=${BACKUP_DIR:/backups}
app.backup.pg-dump=${PG_DUMP:pg_dump}
app.backup.pg-restore=${PG_RESTORE:pg_restore}
app.backup.psql=${PSQL:psql}
app.backup.r2.endpoint=${R2_ENDPOINT:}
app.backup.r2.bucket=${R2_BUCKET:}
app.backup.r2.access-key=${R2_ACCESS_KEY_ID:}
app.backup.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
# What the page measures the R2 copies against: the 10 GB free allowance.
# Going past it is allowed — Cloudflare then bills about $0.015 per GB a month.
app.backup.r2.limit-bytes=${R2_LIMIT_BYTES:10000000000}

# ─────────────────────────────────────────────────────────────────────────────
# Inbox — decided 2026-10-20, the oneBase way. One Gmail mailbox that every
# brand address forwards into (Cloudflare Email Routing), read live over IMAP.
#   INBOX_USERNAME  the Gmail address
#   INBOX_PASSWORD  a Google App Password (myaccount.google.com/apppasswords)
# The brand addresses are on the Configuration page; each must also be in the
# mailbox's Gmail "Send mail as" list.
# Unset username = the Inbox says "not set up". Files attached to an outgoing
# email are capped at Gmail's 25 MB.
# ─────────────────────────────────────────────────────────────────────────────
app.inbox.username=${INBOX_USERNAME:}
app.inbox.password=${INBOX_PASSWORD:}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# ─────────────────────────────────────────────────────────────────────────────
# SEO Overview — decided 2026-10-20, the oneBase way: each brand's Google
# Analytics 4, read live (kept 10 minutes in memory, nothing stored).
#   GA4_CREDENTIALS_FILE  the service account's key file on the server. The
#                         deploy writes it from the GA4_CREDENTIALS secret.
#                         Empty = "not connected".
#   SEO_TIMEZONE          the business calendar for "today", "this month"…
# The service account must be a Viewer in each brand's GA4 property; the
# property's number goes on Configuration → Brands.
# ─────────────────────────────────────────────────────────────────────────────
app.seo.credentials-file=${GA4_CREDENTIALS_FILE:}
app.seo.timezone=${SEO_TIMEZONE:America/Toronto}
