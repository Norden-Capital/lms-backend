spring.application.name=Backend

# Datasource - local defaults, overridden by SPRING_DATASOURCE_* env vars in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lmsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lmsuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lmspassword123}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Springdoc OpenAPI JSON path (the UI page itself is served by DocsController at /api/docs)
springdoc.api-docs.path=/v3/api-docs
